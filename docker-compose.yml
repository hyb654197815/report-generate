services:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb local/reports --ignore-existing &&
      mc anonymous set download local/reports || true;
      exit 0;
      "

  gotenberg:
    image: gotenberg/gotenberg:8

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
    environment:
      DATABASE_URL: mysql://root:dowinno.1~@121.43.27.98:3306/report_generate
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: reports
      GOTENBERG_URL: http://gotenberg:3000
      HTTP_ALLOWLIST_HOSTS: '*'
      SCRIPT_TIMEOUT_MS: '12000'
      OPENAI_BASE_URL: https://api.openai.com/v1
      AI_MOCK_ENABLED: 'false'
      AI_DAILY_LIMIT: '100'
      PORT: '4000'
      CORS_ORIGIN: http://localhost:10099

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - api
    ports:
      - '10099:80'

volumes:
  minio_data:
